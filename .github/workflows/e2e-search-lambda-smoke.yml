name: Reusable — Search Lambda Smoke

on:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-e2e-search-lambda
  cancel-in-progress: true

env:
  MAVEN_OPTS: -Xmx1g -Xms512m
  MAVEN_ARGS_BUILD: -B -T 1C -V -Dmaven.test.redirectTestOutputToFile=true -Dsurefire.parallel=none -Dfailsafe.parallel=none -Dmaven.repo.local=${{ github.workspace }}/.m2/repository

jobs:
  search-lambda-smoke:
    name: Search Lambda Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-path: ${{ github.workspace }}/.m2/repository

      - name: Configure Maven
        run: echo "MAVEN_ARGS=${{ env.MAVEN_ARGS_BUILD }} --no-transfer-progress" >> $GITHUB_ENV

      - name: Build search Lambda topology prerequisites
        run: ./search/build-lambda.sh -DskipTests -Dquarkus.container-image.build=false

      - name: Run search Lambda mock-server smoke test
        run: |
          read -r -a maven_args <<< "$MAVEN_ARGS"
          ./mvnw "${maven_args[@]}" -f search/pom.xml \
            -pl orchestrator-svc \
            -Dtpf.build.platform=FUNCTION \
            -Dtpf.build.transport=REST \
            -Dtpf.build.rest.naming.strategy=RESOURCEFUL \
            -Dtpf.build.lambda.scope=compile \
            -Dquarkus.profile=lambda \
            -Dtest=LambdaMockEventServerSmokeTest \
            -Dquarkus.container-image.build=false \
            test

      - name: Dump reports on failure
        if: failure()
        run: |
          find . -path "*/target/surefire-reports/*.txt" -print -exec tail -n 200 {} \;
          find . -path "*/target/failsafe-reports/*.txt" -print -exec tail -n 200 {} \;

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: search-lambda-smoke-reports
          path: |
            **/target/surefire-reports/*.txt
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.txt
            **/target/failsafe-reports/*.xml
          retention-days: 7
          if-no-files-found: warn
