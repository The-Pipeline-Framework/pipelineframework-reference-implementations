name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkout-sync:
    uses: ./.github/workflows/e2e-checkout-tpfgo-smoke.yml

  checkout-queue-async-ha:
    if: ${{ github.event_name != 'pull_request' }}
    uses: ./.github/workflows/e2e-checkout-tpfgo-queue-async-ha.yml

  search-resource-contracts:
    uses: ./.github/workflows/e2e-search-resource-it.yml

  search-lambda:
    uses: ./.github/workflows/e2e-search-lambda-smoke.yml

  search-topology:
    uses: ./.github/workflows/e2e-search-pipeline-e2e.yml

  quickbooks:
    name: QuickBooks Collections Briefing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-path: ${{ github.workspace }}/.m2/repository

      - name: Verify
        run: >-
          ./mvnw -B -f quickbooks-collections-briefing/pom.xml clean verify
          -Dgpg.skip
          -Dmaven.repo.local="$GITHUB_WORKSPACE/.m2/repository"
          --no-transfer-progress
