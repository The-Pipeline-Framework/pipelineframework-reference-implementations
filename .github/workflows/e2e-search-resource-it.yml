name: Reusable — Search Resource IT

on:
  workflow_call:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-e2e-search-resource-it
  cancel-in-progress: true

env:
  MAVEN_OPTS: -Xmx1g -Xms512m
  MAVEN_ARGS_BUILD: -B -T 1 -V -Dmaven.test.redirectTestOutputToFile=true -Dsurefire.parallel=none -Dfailsafe.parallel=none -Dquarkus.http.test-port=0 -Dquarkus.grpc.server.test-port=0 -Dmaven.repo.local=${{ github.workspace }}/.m2/repository

jobs:
  search-resource-it:
    name: Search Resource IT
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-path: ${{ github.workspace }}/.m2/repository

      - name: Configure Maven
        run: echo "MAVEN_ARGS=${{ env.MAVEN_ARGS_BUILD }} --no-transfer-progress" >> $GITHUB_ENV

      - name: Run Search resource integration tests
        run: |
          read -r -a maven_args <<< "$MAVEN_ARGS"
          ./mvnw "${maven_args[@]}" -f search/pom.xml \
            -pl crawl-source-svc,parse-document-svc,tokenize-content-svc,index-document-svc \
            -am \
            -DskipUnitTests=true \
            -DskipNative=true \
            -Dquarkus.container-image.build=false \
            -Dfailsafe.failIfNoSpecifiedTests=false \
            -Dit.test=RawDocumentResourceIT,ParsedDocumentResourceIT,TokenBatchResourceIT,IndexAckResourceIT \
            verify

      - name: Dump reports on failure
        if: failure()
        run: |
          find search -path "*/target/failsafe-reports/*.txt" -print -exec tail -n 200 {} \;
          find search -path "*/target/failsafe-reports/*.dumpstream" -print -exec tail -n 400 {} \;
          find search -path "*/target/failsafe-reports/*.dump" -print -exec tail -n 200 {} \;
          find search -path "*/target/surefire-reports/*.txt" -print -exec tail -n 200 {} \;

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: search-resource-it-reports
          path: |
            search/**/target/surefire-reports/*.txt
            search/**/target/surefire-reports/*.xml
            search/**/target/failsafe-reports/*.txt
            search/**/target/failsafe-reports/*.xml
            search/**/target/failsafe-reports/*.dumpstream
            search/**/target/failsafe-reports/*.dump
          retention-days: 7
          if-no-files-found: warn
