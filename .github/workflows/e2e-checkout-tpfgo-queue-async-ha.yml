name: Reusable — Checkout TPFGo Checkpoint Flow

on:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-e2e-checkout-tpfgo-checkpoint
  cancel-in-progress: true

env:
  MAVEN_OPTS: -Xmx2g -Xms512m
  MAVEN_ARGS_BUILD: -B -T 1 -V -Dmaven.test.redirectTestOutputToFile=true -Dsurefire.parallel=none -Dfailsafe.parallel=none -Dmaven.repo.local=${{ github.workspace }}/.m2/repository

jobs:
  checkout-tpfgo-checkpoint:
    name: Checkout TPFGo Checkpoint Flow
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-path: ${{ github.workspace }}/.m2/repository

      - name: Configure Maven
        run: echo "MAVEN_ARGS=${{ env.MAVEN_ARGS_BUILD }} --no-transfer-progress" >> $GITHUB_ENV

      - name: Run full TPFGo checkpoint-flow suite
        run: |
          read -r -a maven_args <<< "$MAVEN_ARGS"
          ./mvnw "${maven_args[@]}" -f checkout/pom.xml \
            -pl tpfgo-e2e-tests \
            -am \
            -Dtest=NoMatchingUnitTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dit.test=TpfgoCheckpointFlowIT \
            -Dfailsafe.failIfNoSpecifiedTests=false \
            verify

      - name: Dump TPFGo diagnostics on failure
        if: failure()
        run: |
          if [ -d checkout/tpfgo-e2e-tests/target/failsafe-reports ]; then
            find checkout/tpfgo-e2e-tests/target/failsafe-reports -maxdepth 2 -type f -print -exec tail -n 200 {} \; || true
          fi

      - name: Upload TPFGo diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checkout-tpfgo-checkpoint-diagnostics
          path: |
            checkout/tpfgo-e2e-tests/target/failsafe-reports/**
            checkout/tpfgo-e2e-tests/target/surefire-reports/**
          retention-days: 7
          if-no-files-found: warn
