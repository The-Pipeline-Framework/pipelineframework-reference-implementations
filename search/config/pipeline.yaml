version: 3
appName: Search Pipeline
basePackage: org.pipelineframework.search
transport: REST
platform: COMPUTE
types:
  FetchHeader:
    java: org.pipelineframework.search.common.canonical.FetchHeader
    fields:
      - [name, string]
      - [value, string]
  CrawlRequest:
    java: org.pipelineframework.search.common.canonical.CrawlRequest
    fields:
      - [docId, uuid]
      - [sourceUrl, string]
      - [fetchMethod, string]
      - [accept, string]
      - [acceptLanguage, string]
      - ['authScope?', string]
      - name: fetchHeaders
        repeated: FetchHeader
  RawDocument:
    java: org.pipelineframework.search.common.canonical.RawDocument
    fields:
      - [docId, uuid]
      - [sourceUrl, string]
      - [fetchOptions, string]
      - [rawContent, string]
      - [rawContentHash, string]
      - [fetchedAt, timestamp]
  ParsedDocument:
    java: org.pipelineframework.search.common.canonical.ParsedDocument
    fields:
      - [docId, uuid]
      - [title, string]
      - [content, string]
      - [contentHash, string]
      - [rawContentHash, string]
      - [extractedAt, timestamp]
  TokenBatch:
    java: org.pipelineframework.search.common.canonical.TokenBatch
    fields:
      - [docId, uuid]
      - [batchIndex, int32]
      - [tokenCount, int32]
      - [tokens, string]
      - [tokensHash, string]
      - [contentHash, string]
      - [tokenizedAt, timestamp]
  EmbeddedChunk:
    java: org.pipelineframework.search.common.canonical.EmbeddedChunk
    fields:
      - [docId, uuid]
      - [batchIndex, int32]
      - [tokenCount, int32]
      - [tokens, string]
      - [tokensHash, string]
      - [contentHash, string]
      - [vectorHash, string]
      - [vectorVersion, string]
      - [embeddedAt, timestamp]
  SearchIndexDocument:
    java: org.pipelineframework.search.common.canonical.SearchIndexDocument
    fields:
      - [docId, uuid]
      - [externalId, string]
      - [batchIndex, int32]
      - [tokenCount, int32]
      - [tokens, string]
      - [tokensHash, string]
      - [contentHash, string]
      - [vectorHash, string]
      - [vectorVersion, string]
      - [indexName, string]
      - [preparedAt, timestamp]
  SearchIndexWriteResult:
    java: org.pipelineframework.search.common.canonical.SearchIndexWriteResult
    fields:
      - [docId, uuid]
      - [externalId, string]
      - [commandId, string]
      - [indexName, string]
      - [resultStatus, string]
      - [createdOrUpdated, bool]
      - [recordedDuplicate, bool]
      - [batchIndex, int32]
      - [tokenCount, int32]
      - [tokens, string]
      - [tokensHash, string]
      - [vectorHash, string]
      - [vectorVersion, string]
      - [indexedAt, timestamp]
  IndexAck:
    java: org.pipelineframework.search.common.canonical.IndexAck
    fields:
      - [docId, uuid]
      - [indexVersion, string]
      - [tokensHash, string]
      - [tokenBatchCount, int32]
      - [uniqueTokenCount, int32]
      - [topToken, string]
      - [indexedAt, timestamp]
      - [success, bool]
steps:
- name: Crawl Source
  service: org.pipelineframework.search.crawl_source.service.CanonicalCrawlSourceService
  cardinality: ONE_TO_ONE
  input: CrawlRequest
  output: RawDocument
  java:
    input: org.pipelineframework.search.common.canonical.CrawlRequest
    output: org.pipelineframework.search.common.canonical.RawDocument
- name: Parse Document
  service: org.pipelineframework.search.parse_document.service.CanonicalParseDocumentService
  cardinality: ONE_TO_ONE
  input: RawDocument
  output: ParsedDocument
  java:
    input: org.pipelineframework.search.common.canonical.RawDocument
    output: org.pipelineframework.search.common.canonical.ParsedDocument
- name: Tokenize Content
  service: org.pipelineframework.search.tokenize_content.service.CanonicalTokenizeContentService
  cardinality: ONE_TO_MANY
  input: ParsedDocument
  output: TokenBatch
  java:
    input: org.pipelineframework.search.common.canonical.ParsedDocument
    output: org.pipelineframework.search.common.canonical.TokenBatch
- name: Embed Content
  service: org.pipelineframework.search.embed_content.service.CanonicalEmbedContentService
  cardinality: ONE_TO_ONE
  input: TokenBatch
  output: EmbeddedChunk
  java:
    input: org.pipelineframework.search.common.canonical.TokenBatch
    output: org.pipelineframework.search.common.canonical.EmbeddedChunk
- name: Build Search Index Document
  service: org.pipelineframework.search.index_document.service.CanonicalBuildSearchIndexDocumentService
  cardinality: ONE_TO_ONE
  input: EmbeddedChunk
  output: SearchIndexDocument
  java:
    input: org.pipelineframework.search.common.canonical.EmbeddedChunk
    output: org.pipelineframework.search.common.canonical.SearchIndexDocument
- name: Write Search Index Document
  kind: command
  command: opensearch-index-document-v3
  commandIdGenerator: org.pipelineframework.search.common.command.CanonicalSearchIndexDocumentCommandIdGenerator
  duplicatePolicy: RETURN_RECORDED
  cardinality: ONE_TO_ONE
  input: SearchIndexDocument
  output: SearchIndexWriteResult
  java:
    input: org.pipelineframework.search.common.canonical.SearchIndexDocument
    output: org.pipelineframework.search.common.canonical.SearchIndexWriteResult
- name: Summarize Index Writes
  service: org.pipelineframework.search.index_document.service.CanonicalSummarizeIndexWritesService
  cardinality: MANY_TO_ONE
  input: SearchIndexWriteResult
  output: IndexAck
  java:
    input: org.pipelineframework.search.common.canonical.SearchIndexWriteResult
    output: org.pipelineframework.search.common.canonical.IndexAck
aspects:
  persistence:
    enabled: true
    scope: GLOBAL
    position: AFTER_STEP
    order: 0
    config:
      pluginImplementationClass: org.pipelineframework.search.persistence.SearchPersistenceService
  cache:
    enabled: true
    scope: GLOBAL
    position: AFTER_STEP
    order: 5
    config:
      pluginImplementationClass: org.pipelineframework.plugin.cache.CacheService
  cache-invalidate:
    enabled: true
    scope: STEPS
    position: BEFORE_STEP
    order: -4
    config:
      targetSteps:
      - Tokenize Content
      pluginImplementationClass: org.pipelineframework.plugin.cache.CacheInvalidationService
  cache-invalidate-all:
    enabled: true
    scope: STEPS
    position: BEFORE_STEP
    order: -5
    config:
      targetSteps:
      - Parse Document
      pluginImplementationClass: org.pipelineframework.plugin.cache.CacheInvalidationAllService
